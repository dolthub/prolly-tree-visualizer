server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The base image's mime.types already maps .wasm to application/wasm, which
    # WebAssembly.instantiateStreaming requires. Do not add a `types` block here:
    # it would replace that map rather than extend it.

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Matches the dev and preview headers in vite.config.ts so OPFS-backed
    # DoltLite storage keeps working in a deployed build.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Vite content-hashes everything under /assets/, so it can be cached forever.
    # add_header in a location replaces the server-level headers, so repeat them.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
